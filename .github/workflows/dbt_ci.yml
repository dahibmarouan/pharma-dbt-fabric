name: CI dbt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract openFDA data
        working-directory: .
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
        run: python scripts/extract_openfda.py

      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt
          cat << EOF > ~/.dbt/profiles.yml
          pharma_project:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: 'data/warehouse.duckdb'
                threads: 4
          EOF

      - name: Prepare DuckDB data directory
        working-directory: pharma_project
        run: mkdir -p data

      - name: dbt build
        working-directory: pharma_project
        run: dbt build