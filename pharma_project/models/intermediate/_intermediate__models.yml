version: 2

models:
  - name: int_openfda__adverse_events_deduped
    description: "Adverse event reports after excluding duplicates flagged by openFDA."
    columns:
      - name: report_id
        description: "Unique report identifier, guaranteed unique after deduplication."
        tests:
          - unique
          - not_null

  - name: int_openfda__drugs_deduped
    description: "Drugs associated with non-duplicate reports."
    columns:
      - name: report_id
        tests:
          - not_null
          - relationships:
              to: ref('int_openfda__adverse_events_deduped')
              field: report_id
      - name: drug_name
        description: "Drug name as reported."

  - name: int_openfda__reactions_deduped
    description: "Reactions associated with non-duplicate reports."
    columns:
      - name: report_id
        tests:
          - not_null
          - relationships:
              to: ref('int_openfda__adverse_events_deduped')
              field: report_id
      - name: reaction_name
        description: "Reaction name as reported."