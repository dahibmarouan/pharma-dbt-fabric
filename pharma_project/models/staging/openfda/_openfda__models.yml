version: 2

models:
  - name: stg_openfda__adverse_events
    description: "One adverse event report per row, with simple fields cleaned and typed."
    columns:
      - name: report_id
        description: "Unique identifier of the report."
        tests:
          - unique
          - not_null
      - name: patient_age
        description: "Patient's age at the time of the report, in years. Can be NULL if not reported."

  - name: stg_openfda__drugs
    description: "One drug mentioned per report, one row per drug (a report can have several)."
    columns:
      - name: report_id
        description: "Reference to the parent report."
        tests:
          - not_null
      - name: drug_name
        description: "Drug name as reported."
        tests:
          - not_null

  - name: stg_openfda__reactions
    description: "One reaction mentioned per report, one row per reaction."
    columns:
      - name: report_id
        tests:
          - not_null
      - name: reaction_name
        tests:
          - not_null